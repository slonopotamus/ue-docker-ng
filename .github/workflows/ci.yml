name: CI
on: [push, pull_request]
jobs:
  linux-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Run tests
        run: docker buildx bake linux-test
  windows-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - name: Run tests
        run: docker buildx bake windows-test
